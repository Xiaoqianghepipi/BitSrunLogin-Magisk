name: Sync Upstream Release And Publish Module（同步上游发布并发布模块）

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"
  push:
    paths:
      - "module.prop"
      - "bitsrun"
      - "bitsrun_core.sh"
      - "service.sh"
      - "customize.sh"
      - "uninstall.sh"
      - "config/**"
      - "META-INF/**"
      - "README.md"
      - "LICENSE"
      - "CORE_VERSION"

permissions:
  contents: write

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest upstream release（获取最新release）
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          api_url="https://api.github.com/repos/Mmx233/BitSrunLoginGo/releases/latest"
          json="$(curl -fsSL "$api_url")"

          tag="$(echo "$json" | jq -r '.tag_name')"
          release_url="$(echo "$json" | jq -r '.html_url')"
          asset_url="$(echo "$json" | jq -r '.assets[] | select(.name == "bitsrun_android_arm64.tar.gz") | .browser_download_url' | head -n1)"

          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "无法获取上游 release tag" >&2
            exit 1
          fi

          if [ -z "$asset_url" ] || [ "$asset_url" = "null" ]; then
            echo "未找到资产 bitsrun_android_arm64.tar.gz" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_url=$release_url" >> "$GITHUB_OUTPUT"
          echo "asset_url=$asset_url" >> "$GITHUB_OUTPUT"

      - name: Read module version（读取模块版本）
        id: module_info
        shell: bash
        run: |
          set -euo pipefail

          module_version="$(sed -n 's/^version=//p' module.prop | head -n1)"

          if [ -z "$module_version" ]; then
            echo "无法读取模块版本" >&2
            exit 1
          fi

          echo "module_version=$module_version" >> "$GITHUB_OUTPUT"

      - name: Skip if release already exists
        id: check_current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          release_tag="bitsrun_magisk_${{ steps.module_info.outputs.module_version }}_core_${{ steps.upstream.outputs.tag }}"
          status="$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}")"

          if [ "$status" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "当前仓库已存在 tag=${release_tag} 的 release，跳过。"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and extract bitsrun binary（下载bitsrungo android arm64 原始二进制文件）
        if: steps.check_current.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _ci_tmp/extract
          curl -fL "${{ steps.upstream.outputs.asset_url }}" -o _ci_tmp/bitsrun_android_arm64.tar.gz
          tar -xzf _ci_tmp/bitsrun_android_arm64.tar.gz -C _ci_tmp/extract

          candidate=""
          if [ -f "_ci_tmp/extract/bitsrun" ]; then
            candidate="_ci_tmp/extract/bitsrun"
          else
            candidate="$(find _ci_tmp/extract -type f \( -name 'bitsrun' -o -iname '*bitsrun*' -o -iname '*BitSrun*' \) | head -n1 || true)"
          fi

          if [ -z "$candidate" ]; then
            echo "解压后未找到 bitsrun 可执行文件" >&2
            find _ci_tmp/extract -maxdepth 3 -type f | sed 's/^/  /'
            exit 1
          fi

          cp "$candidate" ./bitsrun

      - name: Write CORE_VERSION and package zip（更新CORE_VERSION并将模块打包为zip）
        if: steps.check_current.outputs.exists == 'false'
        id: package
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.upstream.outputs.tag }}"
          module_version="${{ steps.module_info.outputs.module_version }}"

          # 记录上游内核版本，供安装时展示
          printf "%s\n" "$tag" > CORE_VERSION

          zip_name="bitsrun_magisk_${module_version}_core_${tag}.zip"
          zip -r "$zip_name" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "_ci_tmp/*"

          echo "module_version=$module_version" >> "$GITHUB_OUTPUT"
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"

      - name: Create release and upload module zip（创建 release 并上传模块zip）
        if: steps.check_current.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bitsrun_magisk_${{ steps.package.outputs.module_version }}_core_${{ steps.upstream.outputs.tag }}
          name: bitsrun_magisk_${{ steps.package.outputs.module_version }}_core_${{ steps.upstream.outputs.tag }}
          body: |
            喜报：自动构建成功了！！！
            Module version: ${{ steps.package.outputs.module_version }}
            Auto-built from upstream release: ${{ steps.upstream.outputs.release_url }}
            
            Asset synced: bitsrun_android_arm64.tar.gz
            Included binary: bitsrun
          files: ${{ steps.package.outputs.zip_name }}
